name: Build signed release APK

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Gradle daemon is pinned to JDK 25 (gradle/gradle-daemon-jvm.properties).
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rushio-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/rushio-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Verify signature and rename APK
        run: |
          APK=$(find androidApp/build/outputs/apk/release -name "*.apk" -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::No release APK found"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK"
          VERSION=$(grep -E 'val appVersionName' androidApp/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          mkdir -p dist
          cp "$APK" "dist/Rushio-${VERSION}-${GITHUB_SHA::7}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rushio-release-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/rushio-release.jks"
